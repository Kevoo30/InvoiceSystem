{% extends "base.html" %}
{% block title %}New order{% endblock %}
{% block content %}
<div class="page-head"><h1>New order</h1></div>
<div class="card" style="max-width:560px">
  <form method="get">
    <label for="supplier" style="margin-top:0">Supplier</label>
    <select id="supplier" name="supplier" class="w100" onchange="this.form.submit()">
      <option value="">Choose supplier</option>
      {% for s in suppliers %}<option value="{{ s.id }}" {{ 'selected' if supplier and supplier.id == s.id }}>{{ s.name }}</option>{% endfor %}
    </select>
    <noscript><div class="actions"><button type="submit">Continue</button></div></noscript>
  </form>
</div>
{% if supplier %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="supplier_id" value="{{ supplier.id }}">
  <div class="card" style="max-width:320px"><label for="order_date" style="margin-top:0">Date</label>
    <input id="order_date" name="order_date" type="date" class="w100" max="{{ today }}" value="{{ values.get('order_date') or today }}"></div>
  <div class="card flush scroll">
    <table>
      <thead><tr><th>Material</th><th>Unit</th><th class="num">Qty</th><th class="num">Agreed price (KES)</th></tr></thead>
      <tbody>
      {% for m in materials %}
        <tr><td>{{ m.name }}</td><td class="muted">{{ m.unit }}</td>
          <td class="num"><input class="qty-in" type="number" name="qty_{{ m.id }}" min="0" step="0.01" value="{{ values.get('qty_%d'|format(m.id), '') }}" aria-label="Quantity {{ m.name }}"></td>
          <td class="num"><input class="qty-in" type="number" name="price_{{ m.id }}" min="0" step="0.01" placeholder="{{ hints[m.id]|money if hints[m.id] is not none else '' }}" value="{{ values.get('price_%d'|format(m.id), '') }}" aria-label="Price {{ m.name }}"></td></tr>
      {% else %}<tr><td colspan="4" class="empty">No materials for this supplier.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
  <div class="actions"><button type="submit">Save order</button><a class="btn secondary" href="{{ url_for('orders') }}">Cancel</a></div>
</form>
{% endif %}
{% endblock %}
