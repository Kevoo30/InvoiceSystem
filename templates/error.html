{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div style="min-height:60vh;display:grid;place-items:center">
  <div class="card" style="max-width:420px;text-align:center">
    <h1 style="font-size:3rem">{{ code }}</h1>
    <p class="sub" style="margin:8px 0 20px">{{ message }}</p>
    <a class="btn" href="{{ url_for('home') }}">Back to home</a>
  </div>
</div>
{% endblock %}
